<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhD Research System - React Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM desde CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Componente principal
        function PhDResearchApp() {
            const [topic, setTopic] = useState('');
            const [provider, setProvider] = useState('groq');
            const [model, setModel] = useState('llama-3.1-70b-versatile');
            const [apiKey, setApiKey] = useState('');
            const [loading, setLoading] = useState(false);
            const [results, setResults] = useState(null);
            const [error, setError] = useState(null);
            const [showPassword, setShowPassword] = useState(false);

            const models = {
                groq: ['llama-3.1-70b-versatile', 'llama-3.1-8b-instant'],
                openai: ['gpt-4-turbo-preview', 'gpt-3.5-turbo']
            };

            const steps = [
                'Research Problem & Questions',
                'Literature Review Insights',
                'Philosophical Position',
                'Research Design',
                'Data Collection Methods',
                'Sampling Strategy',
                'Data Analysis Plan',
                'Quality Criteria',
                'Ethical Considerations',
                'Pilot & Refinement Plan'
            ];

            useEffect(() => {
                lucide.createIcons();
            }, [loading, results, error]);

            const handleProviderChange = (newProvider) => {
                setProvider(newProvider);
                setModel(models[newProvider][0]);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (!topic.trim()) {
                    setError('Por favor ingresa un tema de investigación');
                    return;
                }
                if (!apiKey.trim()) {
                    setError('Por favor ingresa tu API key');
                    return;
                }

                setLoading(true);
                setError(null);
                setResults(null);

                try {
                    const response = await fetch('http://localhost:5000/api/analyze', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            topic: topic.trim(),
                            provider,
                            model,
                            api_key: apiKey.trim()
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Error en el análisis');
                    }

                    setResults(data);
                } catch (err) {
                    setError(err.message || 'Error al procesar la solicitud');
                } finally {
                    setLoading(false);
                }
            };

            const copyToClipboard = () => {
                if (results) {
                    navigator.clipboard.writeText(results.methodology)
                        .then(() => alert('✅ Metodología copiada al portapapeles'))
                        .catch(() => alert('❌ No se pudo copiar'));
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
                    <div className="container mx-auto px-4 py-8 max-w-7xl">
                        
                        {/* Header */}
                        <div className="text-center mb-12 fade-in">
                            <div className="flex items-center justify-center gap-3 mb-4">
                                <i data-lucide="brain" className="w-12 h-12 text-indigo-600"></i>
                                <h1 className="text-5xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                                    PhD Research System
                                </h1>
                            </div>
                            <p className="text-xl text-gray-600 mb-2">Sistema Multi-Agente con 11 Agentes Especializados</p>
                            <p className="text-sm text-gray-500 mb-4">Genera metodologías de investigación completas siguiendo 10 pasos académicos</p>
                            <div className="inline-flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-md text-sm">
                                <i data-lucide="clock" className="w-4 h-4 text-indigo-600"></i>
                                <span className="text-gray-700">Tiempo estimado: <strong>3-5 minutos</strong> por análisis</span>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            
                            {/* FORMULARIO */}
                            <div className="bg-white bg-opacity-95 rounded-2xl shadow-xl p-8 border border-gray-100 fade-in">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                                    <i data-lucide="book-open" className="w-6 h-6 text-indigo-600"></i>
                                    Configuración
                                </h2>

                                <form onSubmit={handleSubmit} className="space-y-6">
                                    
                                    {/* Tema */}
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                                            🔍 Tema de Investigación
                                        </label>
                                        <textarea
                                            value={topic}
                                            onChange={(e) => setTopic(e.target.value)}
                                            placeholder="Ej: Impact of Remote Work on Employee Mental Health and Productivity"
                                            rows="4"
                                            className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all resize-none"
                                            required
                                        />
                                    </div>

                                    {/* Proveedor */}
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-3">
                                            🤖 Proveedor de IA
                                        </label>
                                        <div className="grid grid-cols-2 gap-4">
                                            <button
                                                type="button"
                                                onClick={() => handleProviderChange('groq')}
                                                className={`px-4 py-3 rounded-lg font-semibold transition-all ${
                                                    provider === 'groq'
                                                        ? 'bg-indigo-600 text-white shadow-lg scale-105'
                                                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                }`}
                                            >
                                                <div className="flex items-center justify-center gap-2">
                                                    <i data-lucide="zap" className="w-5 h-5"></i>
                                                    <span>Groq</span>
                                                </div>
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => handleProviderChange('openai')}
                                                className={`px-4 py-3 rounded-lg font-semibold transition-all ${
                                                    provider === 'openai'
                                                        ? 'bg-indigo-600 text-white shadow-lg scale-105'
                                                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                }`}
                                            >
                                                OpenAI
                                            </button>
                                        </div>
                                        <p className="text-xs text-gray-500 mt-2">
                                            Groq es más rápido y económico (~$0.10 vs $2-5)
                                        </p>
                                    </div>

                                    {/* Modelo */}
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                                            🎯 Modelo
                                        </label>
                                        <select
                                            value={model}
                                            onChange={(e) => setModel(e.target.value)}
                                            className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all"
                                        >
                                            {models[provider].map(m => (
                                                <option key={m} value={m}>{m}</option>
                                            ))}
                                        </select>
                                        <p className="text-xs text-gray-500 mt-2">
                                            {provider === 'groq' ? 'Llama 70B ofrece buen balance calidad/precio' : 'GPT-4 ofrece mejor calidad'}
                                        </p>
                                    </div>

                                    {/* API Key */}
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-2">
                                            <i data-lucide="key" className="w-4 h-4"></i>
                                            API Key
                                        </label>
                                        <div className="relative">
                                            <input
                                                type={showPassword ? "text" : "password"}
                                                value={apiKey}
                                                onChange={(e) => setApiKey(e.target.value)}
                                                placeholder={provider === 'openai' ? 'sk-...' : 'gsk_...'}
                                                className="w-full px-4 py-3 pr-12 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all"
                                                required
                                            />
                                            <button
                                                type="button"
                                                onClick={() => setShowPassword(!showPassword)}
                                                className="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
                                            >
                                                <i data-lucide={showPassword ? "eye-off" : "eye"} className="w-5 h-5"></i>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Botón Submit */}
                                    <button
                                        type="submit"
                                        disabled={loading}
                                        className="w-full gradient-bg text-white font-bold py-4 rounded-lg hover:shadow-lg transform hover:scale-105 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center gap-2"
                                    >
                                        {loading ? (
                                            <>
                                                <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                                <span>Analizando...</span>
                                            </>
                                        ) : (
                                            <>
                                                <i data-lucide="rocket" className="w-5 h-5"></i>
                                                <span>Iniciar Análisis de Investigación</span>
                                            </>
                                        )}
                                    </button>
                                </form>

                                {/* Info Boxes */}
                                <div className="mt-8 space-y-4">
                                    <details className="bg-blue-50 border border-blue-200 rounded-lg p-4 cursor-pointer">
                                        <summary className="font-semibold text-blue-900">🔑 Obtener API Keys</summary>
                                        <ul className="text-sm text-blue-800 space-y-1 mt-2">
                                            <li>• <strong>Groq:</strong> <a href="https://console.groq.com/keys" target="_blank" className="underline">console.groq.com/keys</a></li>
                                            <li>• <strong>OpenAI:</strong> <a href="https://platform.openai.com/api-keys" target="_blank" className="underline">platform.openai.com/api-keys</a></li>
                                        </ul>
                                    </details>

                                    <details className="bg-green-50 border border-green-200 rounded-lg p-4 cursor-pointer">
                                        <summary className="font-semibold text-green-900">💰 Costos Aproximados</summary>
                                        <ul className="text-sm text-green-800 space-y-1 mt-2">
                                            <li>• Groq Llama 70B: ~$0.10-0.50 ⭐</li>
                                            <li>• Groq Llama 8B: ~$0.05-0.20</li>
                                            <li>• OpenAI GPT-4: ~$2-5</li>
                                            <li>• OpenAI GPT-3.5: ~$0.50-1</li>
                                        </ul>
                                    </details>
                                </div>
                            </div>

                            {/* RESULTADOS */}
                            <div className="bg-white bg-opacity-95 rounded-2xl shadow-xl p-8 border border-gray-100 fade-in">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                                    <i data-lucide="check-circle" className="w-6 h-6 text-green-600"></i>
                                    Resultados
                                </h2>

                                {/* Estado inicial */}
                                {!loading && !error && !results && (
                                    <div className="text-center py-12 text-gray-500">
                                        <i data-lucide="book-open" className="w-16 h-16 mx-auto mb-4 opacity-50"></i>
                                        <p>Los resultados de tu metodología de investigación aparecerán aquí después de ejecutar el análisis...</p>
                                    </div>
                                )}

                                {/* Estado de carga */}
                                {loading && (
                                    <div className="flex flex-col items-center justify-center py-12">
                                        <div className="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                                        <h3 className="text-xl font-semibold text-gray-800 mb-2">Análisis en Progreso...</h3>
                                        <p className="text-gray-600 text-center">
                                            Los 11 agentes especializados están trabajando en tu metodología de investigación.
                                            <br />
                                            Esto puede tomar 3-5 minutos.
                                        </p>
                                    </div>
                                )}

                                {/* Estado de error */}
                                {error && (
                                    <div className="bg-red-50 border-2 border-red-200 rounded-lg p-4">
                                        <div className="flex items-start gap-3">
                                            <i data-lucide="alert-circle" className="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5"></i>
                                            <div>
                                                <h3 className="font-semibold text-red-900 mb-1">Error</h3>
                                                <p className="text-sm text-red-800">{error}</p>
                                                <div className="mt-3 text-xs text-red-700">
                                                    <p className="font-semibold mb-1">Posibles causas:</p>
                                                    <ul className="list-disc list-inside space-y-1">
                                                        <li>API key inválida o sin créditos</li>
                                                        <li>Problema de conexión</li>
                                                        <li>Límite de rate alcanzado</li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Resultados exitosos */}
                                {results && (
                                    <div className="space-y-6 fade-in">
                                        {/* Metadata */}
                                        <div className="bg-gradient-to-r from-green-50 to-blue-50 rounded-lg p-4 border border-green-200">
                                            <div className="flex items-center gap-2 text-green-800 font-semibold mb-2">
                                                <i data-lucide="check-circle" className="w-5 h-5"></i>
                                                Análisis Completado
                                            </div>
                                            <div className="grid grid-cols-3 gap-4 text-sm">
                                                <div>
                                                    <span className="text-gray-600">Tema:</span>
                                                    <p className="font-semibold text-gray-800">{results.topic}</p>
                                                </div>
                                                <div>
                                                    <span className="text-gray-600">Proveedor:</span>
                                                    <p className="font-semibold text-gray-800">{results.provider.toUpperCase()}</p>
                                                </div>
                                                <div>
                                                    <span className="text-gray-600">Duración:</span>
                                                    <p className="font-semibold text-gray-800">{results.duration}s</p>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Methodology */}
                                        <div>
                                            <div className="flex items-center justify-between mb-3">
                                                <h3 className="text-xl font-bold text-gray-800">📋 Metodología de Investigación PhD</h3>
                                                <button
                                                    onClick={copyToClipboard}
                                                    className="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-lg text-sm hover:bg-indigo-200 transition-colors flex items-center gap-2"
                                                >
                                                    <i data-lucide="copy" className="w-4 h-4"></i>
                                                    Copiar
                                                </button>
                                            </div>
                                            <div className="bg-gray-50 rounded-lg p-6 border border-gray-200 whitespace-pre-wrap text-sm text-gray-700 max-h-96 overflow-y-auto">
                                                {results.methodology}
                                            </div>
                                        </div>

                                        {/* Steps Checklist */}
                                        <div className="bg-indigo-50 rounded-lg p-6 border border-indigo-200">
                                            <h3 className="font-semibold text-indigo-900 mb-3">📋 Pasos Completados:</h3>
                                            <div className="grid grid-cols-2 gap-2 text-sm">
                                                {steps.map((step, i) => (
                                                    <div key={i} className="flex items-center gap-2 text-indigo-800">
                                                        <i data-lucide="check-circle" className="w-4 h-4 text-green-600"></i>
                                                        <span>{step}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <p className="text-xs text-gray-500 text-center italic">
                                            Generado por PhD Research System con 11 agentes especializados
                                        </p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="mt-12 text-center text-sm text-gray-600">
                            <p>Desarrollado con ❤️ usando CrewAI + LangChain + React</p>
                        </div>
                    </div>
                </div>
            );
        }

        // Renderizar la aplicación
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PhDResearchApp />);
    </script>
</body>
</html>
